name: CI/CD Pipeline - DAM Assistant

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. CI - Backend IA (Python / FastAPI / Gemini / SecOps)
  # =========================================================================
  backend-ia-ci:
    name: Backend IA (Python/FastAPI) - Test & SecOps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend_ia
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Unit, Integration & SecOps Tests
        env:
          GEMINI_API_KEY: "dummy_test_key"
          WEBHOOK_TOKEN: "DamBot2026SecureKey!"
          ALLOWED_PHONE_NUMBER: "5511987654321"
        run: |
          pytest -v -o pythonpath=. tests

  # =========================================================================
  # 2. CI - Frontend Dashboard (Angular 17 / TypeScript)
  # =========================================================================
  frontend-dashboard-ci:
    name: Frontend Dashboard (Angular) - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend_dashboard
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend_dashboard/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build -- --configuration production

  # =========================================================================
  # 3. CD - Deploy Contínuo para Produção (GCP VM & Firebase Hosting)
  # Disparado exclusivamente em push na branch main após aprovação dos testes
  # =========================================================================
  deploy-production:
    name: Continuous Deployment (Production)
    needs: [backend-ia-ci, frontend-dashboard-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: "${{ env.GCP_SA_KEY != '' }}"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: "${{ env.GCP_SA_KEY != '' }}"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend IA & Evolution API to Compute Engine VM
        if: "${{ env.GCP_SA_KEY != '' }}"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          tar --exclude="venv" --exclude="__pycache__" --exclude=".pytest_cache" -czf backend_ia.tar.gz -C backend_ia .
          gcloud compute scp backend_ia.tar.gz docker-compose.yml dam-server:/home/PC/ --zone=us-central1-a --project=bot-dam
          gcloud compute ssh dam-server --zone=us-central1-a --project=bot-dam --command="tar -xzf /home/PC/backend_ia.tar.gz -C /home/PC/backend_ia/ && sudo docker compose up -d --build"

      - name: Deploy Frontend Dashboard to Firebase Hosting
        if: "${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: bot-dam
