services:
  # Banco de dados exigido pela Evolution Go
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_password
      POSTGRES_DB: evolution_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Limitação drástica de recursos para e2-micro
    command: postgres -c shared_buffers=64MB -c max_connections=50

  # Servidor do WhatsApp
  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_password@postgres_db:5432/evolution_db?schema=public&connection_limit=20&pool_timeout=60
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-DamBot2026SecureKey!}
      - AUTHENTICATION_TYPE=apikey
      - LOG_LEVEL=ERROR
      - CACHE_REDIS_ENABLED=false
      - RABBITMQ_ENABLED=false
      - WEBSOCKET_ENABLED=false
      - READ_MESSAGES=false
      - READ_STATUS=false
      - GROUPS_IGNORE=true
      - ALWAYS_ONLINE=false
    env_file:
      - ./backend_ia/.env
    volumes:
      - evolution_instances:/app/instances

  # Nosso Motor de IA (FastAPI)
  backend_ia:
    build: 
      context: ./backend_ia
      dockerfile: Dockerfile
    container_name: backend_ia
    restart: always
    ports:
      - "8000:8080"
    env_file:
      - ./backend_ia/.env
    # Mapear a chave JSON do firebase
    volumes:
      - ./backend_ia/firebase-adminsdk.json:/app/firebase-adminsdk.json
    depends_on:
      - evolution_api

volumes:
  postgres_data:
  evolution_instances:
